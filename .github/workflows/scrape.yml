name: Scrape channel

on:
  schedule:
    # GitHub cron is UTC. The window covers roughly 07:00–23:00 in Israel
    # for both standard time (UTC+2) and daylight time (UTC+3), with a
    # short shoulder, and hourly runs overnight.
    - cron: "*/15 4-21 * * *"
    - cron: "0 0-3,22-23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Separate from the backfill group so a queued scrape cannot cancel
# the next backfill run. Pushes rebase and retry in push-archive.sh.
concurrency:
  group: scrape-channel
  cancel-in-progress: false

jobs:
  scrape:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Fetch the newest preview pages
        run: python -m scraper update --pages 2 --delay 2 --image-delay 0.25
      - name: Commit archive changes
        id: commit
        run: .github/scripts/push-archive.sh "Update deals from the Telegram channel"
      - uses: actions/configure-pages@v5
        if: success() && steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: success() && steps.commit.outputs.changed == 'true'
        with:
          path: site
      - id: deployment
        if: success() && steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
