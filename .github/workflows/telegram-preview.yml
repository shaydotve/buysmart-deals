name: Telegram preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reach:
    name: Fetch the public preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      # One preview page only. Affiliate links are not requested.
      - run: python -m scraper smoke
